<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Spring Boot Thymeleaf Hello World Example</title>

    <link rel="stylesheet" th:href="@{webjars/bootstrap/4.2.1/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>

</head>

<body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <a class="navbar-brand" href="#">Spring Boot on App Service</a>
</nav>

<main role="main" class="container">

    <div class="starter-template">
        <h1>Spring Boot</h1>
        <h3>
            ... deployed onto Azure with GitHub Actions
        </h3>
        <p th:text="${message}"></p>
    </div>

    <br>
    <div style="text-align: center;">
        <img class="img-fluid" src="https://swimburger.net/media/ppnn3pcl/azure.png" style="width: 10%"/>
        <img class="img-fluid" src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Heart_coraz%C3%B3n.svg/169px-Heart_coraz%C3%B3n.svg.png" style="width: 10%">
        <img class="img-fluid" src="https://raw.githubusercontent.com/JasonFreeberg/my-spring-app/master/src/main/resources/static/GitHub-Mark-120px-plus.png" style="width: 10%">
    </div>

    <hr>

    <h2>Task Manager</h2>

    <!-- Add task form -->
    <form method="post" action="/" class="form-inline mb-3">
        <input type="text" name="task" class="form-control mr-2" placeholder="New task..." required/>
        <button type="submit" class="btn btn-primary">Add Task</button>
    </form>

    <!-- Filter box -->
    <form method="get" action="/" class="form-inline mb-3">
        <input type="text" name="filter" th:value="${filter}" class="form-control mr-2" placeholder="Filter tasks..."/>
        <button type="submit" class="btn btn-secondary">Filter</button>
        <a href="/" class="btn btn-link ml-2">Clear</a>
    </form>

    <!-- Task list -->
    <ul class="list-group">
        <li th:each="task : ${tasks}" th:text="${task}" class="list-group-item"></li>
        <li th:if="${#lists.isEmpty(tasks)}" class="list-group-item text-muted">No tasks found.</li>
    </ul>

</main>
<!-- /.container -->

<script type="text/javascript" th:src="@{webjars/bootstrap/4.2.1/js/bootstrap.min.js}"></script>
</body>
</html>
